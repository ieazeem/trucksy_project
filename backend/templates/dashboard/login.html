{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Trucksy Dispatch</title>
  <link rel="icon" href="{% static 'dashboard/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'dashboard/trucksy.css' %}">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 16px;
      background: var(--concrete) url("{% static 'dashboard/road.svg' %}") center bottom / cover no-repeat; }
    .login { width: min(420px, 100%); }
    .login .signboard { margin: 0; }
    .login .signboard-inner { display: block; padding: 26px 26px 22px; }
    .login h1 { font-family: var(--display); font-size: 40px; line-height: 1; margin: 14px 0 4px; }
    .login p.lead { color: var(--ink-2); margin: 0 0 22px; }
    .login .field label { color: #fff; }
    .login .field input { border-color: transparent; }
    .login .btn-primary { width: 100%; justify-content: center; padding: 12px; margin-top: 6px; font-size: 16px; }
    .login .form-error { color: var(--stop); }
    .login .stack { display: grid; gap: 14px; }
    .login footer { text-align: center; margin-top: 14px; }
    .login footer span { background: var(--concrete); color: var(--ink-2); font-size: 13px; padding: 3px 10px; border-radius: 999px; }
  </style>
</head>
<body>
  <main class="login">
    <div class="signboard">
      <div class="signboard-inner">
        <span class="wordmark" role="img" aria-label="Trucksy"><span>T</span><span>R</span><span>U</span><span>C</span><span>K</span><span>S</span><span>Y</span></span>
        <h1>Dispatch</h1>
        <p class="lead">Sign in to see your fleet live.</p>
        <form method="post" class="stack">
          {% csrf_token %}
          <div class="field">
            <label for="id_username">Username</label>
            <input id="id_username" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
          </div>
          <div class="field">
            <label for="id_password">Password</label>
            <input id="id_password" name="password" type="password" autocomplete="current-password" required>
          </div>
          {% if form.errors %}<p class="form-error" role="alert">That username and password don't match. Check them and try again.</p>{% endif %}
          <input type="hidden" name="next" value="{{ next|default:'/' }}">
          <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
      </div>
    </div>
    <footer><span>Drivers sign in from the Trucksy Driver app.</span></footer>
  </main>
</body>
</html>
