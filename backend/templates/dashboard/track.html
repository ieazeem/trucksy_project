{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery {{ load.reference }} · Trucksy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="{% static 'dashboard/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/leaflet/leaflet.css' %}">
  <link rel="stylesheet" href="{% static 'dashboard/trucksy.css' %}">
  <style>
    body { background: var(--concrete); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .top .brand-name { color: #fff; font-size: 22px; }
    .signboard-inner { display: block; padding: 18px 20px; }
    .eta-label { color: var(--ink-2); font-size: 14px; }
    .status-big { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1.05; margin: 2px 0 8px; }
    .status-big.moving { color: var(--amber); text-shadow: 0 0 22px rgba(52,211,153,.5); }
    .route-line { color: var(--ink-2); font-size: 15px; }
    #tmap { height: 280px; border-radius: 10px; border: 1px solid #000; margin: 14px 0; }
    .steps { list-style: none; margin: 0; padding: 0; background: var(--paper); border: 1px solid var(--edge); border-radius: 10px; overflow: hidden; }
    .steps li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); color: var(--ink-3); }
    .steps li:first-child { border-top: 0; }
    .steps li.done { color: var(--ink-2); }
    .steps li.now { color: var(--ink); font-weight: 600; background: var(--amber-tint); box-shadow: inset 3px 0 0 var(--amber); }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink-3); justify-self: center; }
    .done .dot { background: var(--amber); border-color: var(--amber); }
    .now .dot { background: #000; border-color: var(--amber); box-shadow: 0 0 10px rgba(52,211,153,.8); }
    .steps time { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .foot { text-align: center; color: var(--ink-2); font-size: 13px; margin-top: 18px; }
  </style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <span class="wordmark" role="img" aria-label="Trucksy"><span>T</span><span>R</span><span>U</span><span>C</span><span>K</span><span>S</span><span>Y</span></span>
  </div>
  <div class="signboard">
    <div class="signboard-inner">
      <div class="eta-label">Delivery {{ load.reference }}</div>
      <div class="status-big" id="status">{{ load.get_status_display }}</div>
      <div class="route-line">{{ load.pickup_address }} &nbsp;to&nbsp; {{ load.dropoff_address }}</div>
    </div>
  </div>
  <div id="tmap" role="region" aria-label="Map of your delivery"></div>
  <ol class="steps" id="steps"></ol>
  <p class="foot" id="foot">This page refreshes by itself.</p>
  <a class="lu-powered" href="https://ssolutions.netlify.app" target="_blank" rel="noopener" title="Powered by Level Up" style="display:block;width:max-content;margin:24px auto;background:#0B2A5B;border-radius:999px;padding:6px 14px;line-height:0;text-decoration:none;opacity:.92"><svg viewBox="0 0 500 80" width="130" height="21" role="img" aria-label="Powered by Level Up"><defs><linearGradient id="luArrowDark" gradientUnits="userSpaceOnUse" x1="80" y1="400" x2="500" y2="90"><stop offset="0" stop-color="#FFB52E"/><stop offset="0.55" stop-color="#F7791E"/><stop offset="1" stop-color="#EC4319"/></linearGradient></defs><text x="184" y="47" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="3" fill="#A9B8D4">POWERED BY</text><g transform="translate(190.1 -0.4) scale(0.151)"><path d="M52 418C250 462 486 404 530 222C486 372 262 436 52 418Z" fill="#FFFFFF"/><path d="M80 398C250 430 440 380 486 178L524 187L489 82L412 161L450 170C410 330 260 392 80 398Z" fill="url(#luArrowDark)" stroke="url(#luArrowDark)" stroke-width="6" stroke-linejoin="round"/></g><text x="282" y="55" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="900" font-style="italic" letter-spacing="-0.5" fill="#FFFFFF">LEVEL <tspan fill="#FF8A2B">UP</tspan></text></svg></a>
</main>
<script src="{% static 'vendor/leaflet/leaflet.js' %}"></script>
{{ code|json_script:"track-code" }}
<script>
(() => {
  const code = JSON.parse(document.getElementById("track-code").textContent);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const t = (d) => d ? new Date(d).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bahrain" }) : "";
  const STEPS = [
    ["pending", "Order received"], ["assigned", "Driver assigned"], ["to_pickup", "On the way to pickup"],
    ["loaded", "Goods loaded"], ["in_transit", "On the way to you"], ["delivered", "Delivered"],
  ];
  const map = L.map("tmap", { zoomControl: false, attributionControl: true }).setView([26.17, 50.56], 11);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    subdomains: "abcd", maxZoom: 19, attribution: "&copy; OpenStreetMap &copy; CARTO" }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  let fitted = false;

  async function load() {
    const r = await fetch(`/api/public/track/${encodeURIComponent(code)}/`);
    if (!r.ok) return;
    const d = await r.json();
    const s = document.getElementById("status");
    s.textContent = d.status === "delivered" ? `Delivered${d.proof_receiver_name ? " to " + d.proof_receiver_name : ""}` : d.status_label;
    s.classList.toggle("moving", ["to_pickup", "loaded", "in_transit"].includes(d.status));

    const at = Object.fromEntries(d.events.map((e) => [e.status, e.at]));
    const order = STEPS.map((x) => x[0]);
    // Delivered = every step done (nothing "in progress" any more).
    const cur = d.status === "cancelled" ? -1 : d.status === "delivered" ? order.length : order.indexOf(d.status);
    document.getElementById("steps").innerHTML = d.status === "cancelled"
      ? `<li class="now"><span class="dot"></span><span>This delivery was cancelled. Please contact us.</span><span></span></li>`
      : STEPS.map(([k, label], i) => `<li class="${i < cur ? "done" : i === cur ? "now" : ""}"><span class="dot"></span>
          <span>${esc(label)}${i === cur && d.driver_first_name && k !== "delivered" && k !== "pending" ? ` · ${esc(d.driver_first_name)}${d.truck_plate ? ", truck " + esc(d.truck_plate) : ""}` : ""}</span>
          <time>${t(at[k])}</time></li>`).join("");

    layer.clearLayers();
    const b = [];
    const pin = (cls) => L.divIcon({ className: "pin-wrap", html: `<div class="place-pin ${cls}"></div>`, iconSize: [14, 14] });
    if (d.pickup_lat != null) { L.marker([d.pickup_lat, d.pickup_lng], { icon: pin("") }).addTo(layer).bindTooltip("Pickup"); b.push([d.pickup_lat, d.pickup_lng]); }
    if (d.dropoff_lat != null) { L.marker([d.dropoff_lat, d.dropoff_lng], { icon: pin("drop") }).addTo(layer).bindTooltip("You"); b.push([d.dropoff_lat, d.dropoff_lng]); }
    if (d.live_location) {
      L.marker([d.live_location.lat, d.live_location.lng], { icon: L.divIcon({ className: "pin-wrap", html: `<span class="truck-pin">${esc(d.truck_plate || "Truck")}</span>`, iconSize: [0, 0] }) }).addTo(layer);
      b.push([d.live_location.lat, d.live_location.lng]);
    }
    if (!fitted && b.length) { map.fitBounds(b, { padding: [36, 36], maxZoom: 13 }); fitted = true; }
    document.getElementById("foot").textContent = d.status === "delivered" || d.status === "cancelled"
      ? "Thank you for shipping with Trucksy." : "This page refreshes by itself every 20 seconds.";
  }
  load(); setInterval(load, 20000);
})();
</script>
</body>
</html>
