{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driver Dashboard</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    header { padding: 20px; background: #2c3e50; color: #fff; text-align: center; }
    .container { padding: 20px; }
    .map-card { height: 400px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background: #2c3e50; color: #fff; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); }
    .modal-content { background-color: #fff; margin: 5% auto; padding: 20px; width: 80%; max-width: 800px; border-radius: 8px; }
    .close { float: right; font-size: 24px; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <h1>Driver Dashboard</h1>
</header>

<div class="container">

  <button id="exportExcelBtn" class="btn btn-primary">
    <i class="fas fa-file-export"></i> Export Report
  </button>

  <div id="map" class="map-card"></div>

  <div class="card">
    <h2>Drivers</h2>
    <table id="drivers-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Truck ID</th>
          <th>Active</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Modal for driver history -->
<div id="historyModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Driver History</h2>
    <div id="historyMap" style="height:400px;"></div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Dashboard JS -->
<script src="{% static 'js/dashboard.js' %}"></script>

<script>
document.getElementById('exportExcelBtn').addEventListener('click', function() {
    // Use the correct URL name from urls.py
    window.location.href = "{% url 'export_drivers_excel' %}";
});
</script>

</body>
</html>
